  <!-- Lead Modal (Clapperboard) -->
  <div class="modal" id="leadModal" aria-hidden="true">
    <div class="modal__backdrop" data-close-modal></div>

    <div class="modal__panel clapper" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <div class="clapper__top" aria-hidden="true"></div>

      <div class="clapper__header">
        <div>
          <div class="kicker">Заявка</div>
          <h3 id="modalTitle" class="h3">Расскажите про проект</h3>
        </div>
        <button class="iconBtn" aria-label="Закрыть" data-close-modal>✕</button>
      </div>

      <form class="form clapper__form" id="leadForm" action="/lead" method="post" data-api="/api/lead" data-success-message="Заявка отправлена. Скоро свяжемся с вами." novalidate>
        <div class="formTrap" aria-hidden="true">
          <label>
            Leave empty
            <input name="website" tabindex="-1" autocomplete="off" />
          </label>
        </div>
        <input type="hidden" name="form_ts" value="">

        <label class="field">
          <span>Имя</span>
          <input name="name" placeholder="Как к вам обращаться" required />
        </label>

        <div class="form__row">
          <label class="field">
            <span>Телефон</span>
            <input name="phone" placeholder="+7 ..." inputmode="tel" autocomplete="tel" />
          </label>

          <label class="field">
            <span>Email</span>
            <input name="email" placeholder="you@email.com" type="email" autocomplete="email" />
          </label>

          <label class="field">
            <span>Telegram (необязательно)</span>
            <input name="telegram" placeholder="@username" autocomplete="off" />
          </label>
        </div>

        <label class="field">
          <span>Что нужно смонтировать?</span>
          <textarea name="message" rows="4" placeholder="Цель, формат, сроки, стиль…"></textarea>
        </label>

        <div class="form__actions">
          <button class="btn btn--primary" type="submit">Отправить</button>
        </div>

        <div class="form__status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <div class="modal" id="briefModal" aria-hidden="true">
    <div class="modal__backdrop" data-close-modal></div>

    <div class="modal__panel clapper briefPanel" role="dialog" aria-modal="true" aria-labelledby="briefTitle" tabindex="-1">
      <div class="clapper__top" aria-hidden="true"></div>

      <div class="clapper__header">
        <div>
          <div class="kicker">Бриф</div>
          <h3 id="briefTitle" class="h3">Короткая анкета</h3>
        </div>
        <button class="iconBtn" aria-label="Закрыть" data-close-modal>✕</button>
      </div>

      <form class="form clapper__form" id="briefForm" action="/brief" method="post" data-api="/api/brief" data-success-message="Бриф отправлен. Мы изучим его и скоро свяжемся." novalidate>
        <div class="formTrap" aria-hidden="true">
          <label>
            Leave empty
            <input name="website" tabindex="-1" autocomplete="off" />
          </label>
        </div>
        <input type="hidden" name="form_ts" value="">

        <label class="field">
          <span>Цель ролика</span>
          <input name="goal" placeholder="Продажи, узнаваемость, обучение..." required />
        </label>

        <label class="field">
          <span>Аудитория</span>
          <input name="audience" placeholder="Кто ваш зритель?" />
        </label>

        <div class="form__row">
          <label class="field">
            <span>Формат</span>
            <input name="format" placeholder="16:9, 9:16, 1:1" />
          </label>

          <label class="field">
            <span>Длительность</span>
            <input name="duration" placeholder="сек/мин" />
          </label>
        </div>

        <div class="form__row">
          <label class="field">
            <span>Площадка</span>
            <input name="platform" placeholder="YouTube, Instagram, VK..." />
          </label>

          <label class="field">
            <span>Сроки</span>
            <input name="deadline" placeholder="Дата/период" />
          </label>
        </div>

        <label class="field">
          <span>Референсы (ссылки)</span>
          <textarea name="refs" rows="3" placeholder="2–3 ссылки на понравившиеся ролики"></textarea>
        </label>

        <label class="field">
          <span>Материалы и объём исходников</span>
          <textarea name="materials" rows="3" placeholder="Сколько исходников, есть ли звук/графика"></textarea>
        </label>

        <div class="form__row">
          <label class="field">
            <span>Графика/титры</span>
            <input name="graphics" placeholder="Нужно/не нужно" />
          </label>

          <label class="field">
            <span>Количество правок</span>
            <input name="revisions" placeholder="1–2 раунда" />
          </label>
        </div>

        <div class="form__row">
          <label class="field">
            <span>Бюджет (опционально)</span>
            <input name="budget" placeholder="Вилка" />
          </label>

          <label class="field">
            <span>Контакт для связи</span>
            <input name="contact" placeholder="Телефон/Telegram" required />
          </label>
        </div>

        <div class="form__actions">
          <button class="btn btn--primary" type="submit">Отправить бриф</button>
          <div class="form__hint">После отправки свяжемся и уточним детали.</div>
        </div>

        <div class="form__status" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <!-- Work Modal -->
  <div class="modal" id="workModal" aria-hidden="true">
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__panel workPanel" role="dialog" aria-modal="true" aria-labelledby="workTitle" tabindex="-1">
      <div class="modal__head workModal__head">
        <div class="workModal__intro">
          <h3 id="workTitle" class="h3 workModal__title">Проект</h3>
        </div>
        <button class="iconBtn" aria-label="Закрыть" data-close-modal>✕</button>
      </div>

      <div class="workModal__body">
        <div class="workModal__media">
          <video class="workModal__video" controls preload="metadata" playsinline aria-label="Видеоплеер">
            <source data-work-source="webm" type="video/webm">
            <source data-work-source="mp4" type="video/mp4">
          </video>
          <div class="workModal__placeholder" data-work-fallback>Видео скоро будет здесь</div>
        </div>
        <div class="workModal__meta">
          <p class="muted workModal__note" data-work-note></p>
          <div class="workModal__actions">
            <button class="btn btn--primary workModal__btn" data-open-modal="leadModal">Обсудить проект</button>
            <button class="btn btn--ghost workModal__btn" data-close-modal>Закрыть</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="static/app.js"></script>
</body>
</html>
